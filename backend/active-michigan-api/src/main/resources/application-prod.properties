spring.application.name=active-michigan-api

# H2 is fine for MVP on Cloud Run, but it will be wiped on restart.
# To use Cloud SQL, uncomment and configure the following:
# spring.datasource.url=jdbc:postgresql:///${DB_NAME}?cloudSqlInstance=${INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
# spring.datasource.username=${DB_USER}
# spring.datasource.password=${DB_PASS}
# spring.datasource.driverClassName=org.postgresql.Driver

# In-memory H2 for MVP.
spring.datasource.url=jdbc:h2:mem:activemichigan;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# CORS: Allow all or specific origins in production.
# Cloud Run URLs change, so for MVP we might allow all or use a variable.
app.cors.allowed-origins=*

# Use a secure secret in production.
app.jwt.secret=${JWT_SECRET:change-this-prod-secret-to-something-secure-and-long}
app.jwt.expiration-minutes=120

management.endpoints.web.exposure.include=health,info
