spring.application.name=active-michigan-api

# Default to an in-memory DB for MVP local dev.
spring.datasource.url=jdbc:h2:mem:activemichigan;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# H2 console for local dev only.
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Allow the frontend dev server.
app.cors.allowed-origins=http://localhost:4200,http://localhost:5173

# JWT settings for local development.
app.jwt.secret=change-this-dev-secret-to-a-long-random-value-please
app.jwt.expiration-minutes=120

management.endpoints.web.exposure.include=health,info
