<section class="panel">
  <div class="listHeader">
    <h2>Admin: user management</h2>
    <p>Requires admin JWT</p>
  </div>
  <form class="filters" (ngSubmit)="createUser()">
    <div class="field">
      <label>User ID (for update/delete)</label>
      <input name="id" [(ngModel)]="form.id" />
    </div>
    <div class="field">
      <label>Email</label>
      <input
        type="email"
        name="email"
        required
        [(ngModel)]="form.email"
      />
    </div>
    <div class="field">
      <label>Password</label>
      <input
        type="password"
        name="password"
        [(ngModel)]="form.password"
      />
    </div>
    <div class="field">
      <label>Display name</label>
      <input
        name="displayName"
        required
        [(ngModel)]="form.displayName"
      />
    </div>
    <div class="field">
      <label>Role</label>
      <select name="role" [(ngModel)]="form.role">
        <option value="PARTICIPANT">PARTICIPANT</option>
        <option value="ORGANIZER">ORGANIZER</option>
        <option value="ADMIN">ADMIN</option>
      </select>
    </div>
    <div class="actions">
      <button type="submit">Create user</button>
      <button type="button" class="secondary" (click)="updateUser()">
        Update
      </button>
      <button type="button" class="secondary" (click)="deleteUser()">
        Delete
      </button>
      <button type="button" class="secondary" (click)="load()">
        Refresh list
      </button>
    </div>
  </form>
  @if (message()) {
    <p class="createMessage">{{ message() }}</p>
  }
  <div class="grid">
    @for (u of users(); track u.id) {
      <article class="card">
        <div class="type">{{ u.role }}</div>
        <h3>{{ u.displayName }}</h3>
        <p class="meta">
          #{{ u.id }} · {{ u.email }}
        </p>
      </article>
    }
  </div>
</section>
