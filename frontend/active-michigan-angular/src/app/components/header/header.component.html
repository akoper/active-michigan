<header class="topbar">
  <a routerLink="/" class="brand" (click)="closeNav()">
    <img src="/android-chrome-512x512.png" alt="Logo" class="logo">
    Active Michigan
  </a>
  <button class="menuBtn secondary" type="button" (click)="toggleNav()">
    Menu
  </button>
  <nav class="navLinks" [class.open]="navOpen()">
    <a routerLink="/account" routerLinkActive="active" (click)="closeNav()">
      Account
    </a>
    @if (authService.isAuthenticated()) {
      <button type="button" class="navLogout secondary" (click)="logout()">
        Sign out
      </button>
    }
  </nav>
</header>
