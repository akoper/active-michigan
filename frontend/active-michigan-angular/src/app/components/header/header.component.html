<header class="topbar">
  <a routerLink="/" class="brand" (click)="closeNav()">
    <img src="/android-chrome-512x512.png" alt="Logo" class="logo">
    Active Michigan
  </a>
  <button class="menuBtn secondary" type="button" (click)="toggleNav()" aria-label="Toggle navigation">
    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>
  <nav class="navLinks" [class.open]="navOpen()">
    @if (!authService.isAuthenticated()) {
      <a routerLink="/login" routerLinkActive="active" (click)="closeNav()">
        Login
      </a>
      <a routerLink="/register" routerLinkActive="active" (click)="closeNav()">
        Register
      </a>
    } @else {
      <a routerLink="/account" routerLinkActive="active" (click)="closeNav()">
        Account
      </a>
      <a (click)="logout()" style="cursor: pointer;">
        Sign out
      </a>
    }
  </nav>
</header>
